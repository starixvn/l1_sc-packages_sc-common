image: node:14

stages:
    - test
    - publish

publish_npm:
    stage: publish
    before_script:
        - apt-get update
        - apt-get upgrade -y
        - apt-get install -y git
    script:
        - npm install -g npm-cli-login
        - npm-cli-login -u luminet.ci -p 1qaz@WSX -e luminet.ci@luminetsoft.com -r http://npm.lumigame.com
        - npm run reg
        - npm i
        - npx semantic-release
    tags:
        - docker

include:
    - project: "lumi-ops/ci-scripts"
      ref: master
      file: "sonarqube.gitlab-ci.yml"
